<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Golden Boundary — An Invitation</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A boundary, a tesseract, and an invitation — for the Royal University of Bhutan.">
<meta name="theme-color" content="#eef1f8">
<!--
  aukora.xyz/royal-invite — self-contained: no frameworks, no trackers, no external requests.
  A click-through fly-through: harp strings resolve to a boundary; the boundary reveals the
  twenty-seven; two cells meet and neither merges; the cost of the meeting is stated; then the
  invitation. Built to match the lander's own hue family (hue-l/hue-c/hue-r), lightened.
-->
<style>
  :root{
    /* the lander's own hue family, kept, lightened for a light ground */
    --hue-l: 24,140,108;      /* was 129,212,180 */
    --hue-c: 60,92,196;       /* was 150,180,255 */
    --hue-r: 122,88,178;      /* was 196,170,255 */
    --gold:  168,124,42;

    --bg0:   #eef1f7;
    --bg1:   #e4e9f3;
    --panel: rgba(35,42,58,.05);
    --panel-br: rgba(35,42,58,.08);
    --border:rgba(35,42,58,.12);
    --ink:   #232a3a;
    --dim:   #5b6478;
    --faint: #8890a0;
    --ease: cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; overflow:hidden; background:var(--bg0); color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased}
  body{
    background:
      radial-gradient(1100px 700px at 18% -6%, rgba(var(--hue-c),.10), transparent 60%),
      radial-gradient(900px 620px at 100% 110%, rgba(var(--hue-r),.08), transparent 55%),
      linear-gradient(180deg, var(--bg0), var(--bg1));
  }
  canvas{position:fixed; inset:0; display:block; touch-action:none}
  #stage{position:fixed; inset:0; cursor:pointer}

  /* ---------- password veil ---------- */
  .veil{position:fixed; inset:0; z-index:20; display:grid; place-items:center;
    background:linear-gradient(180deg, var(--bg0), var(--bg1)); transition:opacity 1.1s var(--ease)}
  .gate{width:min(88vw,400px); text-align:center; padding:2.6rem 2.1rem;
    border:1px solid var(--border); border-radius:16px; background:rgba(255,255,255,.55);
    box-shadow:0 30px 70px -30px rgba(35,42,58,.25); backdrop-filter:blur(8px)}
  .mark{font-size:.68rem; letter-spacing:.4em; text-transform:uppercase; color:rgb(var(--gold)); margin-bottom:1.5rem}
  .gate h1{font-weight:600; font-size:1.4rem; letter-spacing:-.01em; margin-bottom:.5rem; color:var(--ink)}
  .gate p{color:var(--dim); font-size:.9rem; line-height:1.6; margin-bottom:1.6rem}
  .gate input{width:100%; text-align:center; letter-spacing:.32em; text-transform:lowercase;
    background:rgba(35,42,58,.04); border:1px solid var(--border); border-radius:10px; color:var(--ink);
    font-family:inherit; font-size:1rem; padding:.75rem 0; outline:none; transition:border-color .2s}
  .gate input:focus{border-color:rgb(var(--gold))}
  .hint{margin-top:1.1rem; font-size:.72rem; color:var(--faint)}
  .err{color:#b0503f; min-height:1rem; font-size:.76rem; margin-top:.7rem}

  /* ---------- text box (video-game style, click-to-advance) ---------- */
  #ui{position:fixed; inset:0; z-index:10; pointer-events:none;
    display:flex; flex-direction:column; justify-content:flex-end; align-items:center;
    padding:0 6vw 9vh}
  #box{max-width:640px; width:100%; opacity:0; transform:translateY(14px);
    transition:opacity .6s var(--ease), transform .6s var(--ease)}
  #box.on{opacity:1; transform:translateY(0)}
  .k{font-size:.66rem; letter-spacing:.36em; text-transform:uppercase; color:rgb(var(--gold)); margin-bottom:.7rem}
  #box h2{font-weight:600; font-size:clamp(1.3rem,3.6vw,1.85rem); line-height:1.32; letter-spacing:-.01em; margin-bottom:.85rem}
  #box p{color:var(--dim); font-size:clamp(.94rem,2vw,1.02rem); line-height:1.75}
  #box .eq{font-family:Georgia,"Iowan Old Style",serif; color:rgb(var(--gold)); font-size:1.14rem}
  .links{margin-top:1.5rem; display:flex; gap:.6rem; flex-wrap:wrap; pointer-events:auto}
  .links a{display:inline-block; text-decoration:none; font-size:.76rem; letter-spacing:.06em;
    padding:.75rem 1.35rem; border-radius:10px; transition:transform .25s var(--ease), box-shadow .25s var(--ease)}
  .links a.pri{background:rgb(var(--gold)); color:#fff}
  .links a.sec{background:transparent; border:1px solid var(--border); color:var(--ink)}
  .links a:hover{transform:translateY(-2px)}
  .links a.pri:hover{box-shadow:0 10px 26px -10px rgba(var(--gold),.55)}

  #advance{position:fixed; bottom:3.2vh; left:0; right:0; z-index:10; text-align:center;
    font-size:.68rem; letter-spacing:.3em; text-transform:uppercase; color:var(--faint);
    pointer-events:none; opacity:0; transition:opacity .5s ease; animation:pulse 2.6s ease-in-out infinite}
  #advance.on{opacity:.85}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:.95}}

  #skip{position:fixed; top:2.4vh; right:2.4vh; z-index:11; font-size:.66rem; letter-spacing:.18em;
    text-transform:uppercase; color:var(--faint); background:rgba(255,255,255,.5);
    border:1px solid var(--border); border-radius:999px; padding:.5rem 1rem; cursor:pointer;
    opacity:0; transition:opacity .6s ease .4s; pointer-events:none}
  #skip.on{opacity:.75; pointer-events:auto}
  #skip:hover{opacity:1}

  #progress{position:fixed; top:0; left:0; height:2px; background:rgb(var(--gold));
    z-index:12; transition:width .5s var(--ease); width:0%}

  @media (prefers-reduced-motion:reduce){ #advance{animation:none} }
</style>
</head>
<body>

<div class="veil" id="veil">
  <div class="gate">
    <div class="mark">Aukora · The Golden Boundary</div>
    <h1>An Invitation</h1>
    <p>Prepared for the Royal University of Bhutan.<br>Speak the word to open the door.</p>
    <input id="pass" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="passphrase" placeholder="· · · · · · · · ·">
    <div class="err" id="err"></div>
    <div class="hint">a four‑dimensional viewing frame · a nine‑letter room</div>
  </div>
</div>

<div id="progress"></div>
<canvas id="stage"></canvas>
<div id="ui"><div id="box"><div class="k" id="bk"></div><h2 id="bh"></h2><p id="bp"></p><div class="links" id="blinks"></div></div></div>
<div id="advance">click to continue</div>
<div id="skip">skip ↦</div>

<script>
(function(){
"use strict";

/* ============================= gate ============================= */
var veil=document.getElementById('veil'), inp=document.getElementById('pass'), err=document.getElementById('err');
function openGate(){
  veil.style.opacity='0';
  setTimeout(function(){ veil.style.display='none'; boot(); }, 1100);
}
function tryOpen(){
  if(inp.value.trim().toLowerCase()==='tesseract'){ err.textContent=''; openGate(); }
  else { err.textContent='not yet — the nine‑letter room'; inp.value=''; }
}
inp.addEventListener('keydown', function(e){ if(e.key==='Enter') tryOpen(); });
inp.addEventListener('input', function(){ if(inp.value.length>=9) tryOpen(); });
setTimeout(function(){ inp.focus(); }, 400);

/* ============================= boot ============================= */
function boot(){

var cv=document.getElementById('stage'), g=cv.getContext('2d'), W,H,DPR,CX,CY,R;
function size(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  CX=W/2; CY=H*0.44; R=Math.min(W,H)*0.30;
}
size(); addEventListener('resize', size);

var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
var HUE={l:'24,140,108', c:'60,92,196', r:'122,88,178', gold:'168,124,42', ink:'35,42,58'};

/* ---------- 4-cube geometry (verified: 3^3=27, 3^4=81, the 27/27/27 split) ---------- */
var V=[]; for(var i=0;i<16;i++) V.push([(i&1?1:-1),(i&2?1:-1),(i&4?1:-1),(i&8?1:-1)]);
var E=[]; for(i=0;i<16;i++) for(var j=i+1;j<16;j++){ var d=i^j; if((d&(d-1))===0) E.push([i,j]); }
function rot(p,a,b,t){ var c=Math.cos(t),s=Math.sin(t); var q=p.slice();
  q[a]=p[a]*c-p[b]*s; q[b]=p[a]*s+p[b]*c; return q; }
function project(p, wArg){
  var w=1/(2.7-p[3]*(wArg===undefined?0.9:wArg));
  var x=p[0]*w, y=p[1]*w, z=p[2]*w;
  var d=1/(2.5-z*0.8); return [x*d, y*d, (z+2)*0.5];
}

/* ============================= text box / video-game reveal ============================= */
var boxEl=document.getElementById('box'), bk=document.getElementById('bk'), bh=document.getElementById('bh'),
    bp=document.getElementById('bp'), blinks=document.getElementById('blinks'), advEl=document.getElementById('advance');
var typing=false, typeTimer=null, fullText='', shownChars=0, onDoneCb=null;

function showBox(kicker, head, body, links, done){
  boxEl.classList.remove('on'); bk.textContent=kicker; bh.textContent=head; bp.textContent='';
  blinks.innerHTML='';
  requestAnimationFrame(function(){ boxEl.classList.add('on'); });
  fullText=body; shownChars=0; typing=true; advEl.classList.remove('on'); onDoneCb=done;
  clearInterval(typeTimer);
  var speed = reduce ? 0 : 14;
  if(speed===0){ bp.textContent=fullText; finishType(); return; }
  typeTimer=setInterval(function(){
    shownChars+=2; bp.textContent=fullText.slice(0,shownChars);
    if(shownChars>=fullText.length){ clearInterval(typeTimer); finishType(); }
  }, speed);
}
function finishType(){
  typing=false; bp.textContent=fullText; advEl.classList.add('on');
  if(onDoneCb) onDoneCb();
}
function completeTypeNow(){ clearInterval(typeTimer); finishType(); }

/* ============================= scenes ============================= */
var scene=0, t0=performance.now(), formT=0; // formT: local scene-entry time
var SCENES; // defined below, after helpers

function enterScene(n){
  scene=n; formT=performance.now();
  SCENES[n].enter();
}
function advance(){
  if(typing){ completeTypeNow(); return; }
  if(scene < SCENES.length-1) enterScene(scene+1);
}

/* ---------- Scene 0: the harp — waves resolving toward a line ---------- */
function drawHarp(dt){
  g.clearRect(0,0,W,H);
  var n=15, midY=H*0.46;
  var settle=Math.min(1, dt/5200); // strings slowly straighten toward the critical line
  for(var k=0;k<n;k++){
    var amp=(H*0.16)*(1-settle*0.94)*(0.4+0.6*Math.sin(k*1.7));
    var freq=0.9+k*0.14, phase=k*0.7, speed=0.00042+k*0.00003;
    g.beginPath();
    for(var x=0;x<=W;x+=6*DPR){
      var u=x/W;
      var y=midY + amp*Math.sin(u*Math.PI*freq*6 + dt*speed*7 + phase) * Math.sin(u*Math.PI);
      if(x===0) g.moveTo(x,y); else g.lineTo(x,y);
    }
    var alpha=0.05+0.10*(1-Math.abs(k-n/2)/(n/2));
    g.strokeStyle='rgba('+HUE.c+','+(alpha*(1-settle*0.5))+')';
    g.lineWidth=(0.8+0.6*Math.sin(k))*DPR;
    g.stroke();
  }
  // the critical line, brightening as strings settle
  g.beginPath(); g.moveTo(CX, H*0.10); g.lineTo(CX, H*0.82);
  g.strokeStyle='rgba('+HUE.gold+','+(0.12+settle*0.42)+')'; g.lineWidth=1.1*DPR; g.stroke();
  // points landing on the line
  var npts=9;
  for(k=0;k<npts;k++){
    var py=H*0.16 + (H*0.62)*(k/(npts-1));
    var land=Math.max(0, settle - k*0.05);
    var jx = (1-land)*Math.sin(k*2.3+dt*0.0006)*R*0.5;
    g.beginPath(); g.arc(CX+jx, py, (1.6+land*1.4)*DPR,0,6.29);
    g.fillStyle='rgba('+HUE.gold+','+(0.15+land*0.7)+')'; g.fill();
  }
  requestAnimationFrame(loop);
}

/* ---------- Scene 1: the boundary — the tesseract forms from the settled points ---------- */
function drawForm(dt){
  g.clearRect(0,0,W,H);
  var p=Math.min(1, dt/2600);
  var tt=dt*0.00035;
  var pts=V.map(function(v){
    var q=rot(v,0,1,tt*1.3); q=rot(q,2,3,tt*0.9); q=rot(q,0,3,tt*0.5); q=rot(q,1,2,tt*0.35);
    return project(q, 0.85);
  });
  for(var k=0;k<E.length;k++){
    var a=pts[E[k][0]], b=pts[E[k][1]]; var depth=(a[2]+b[2])*0.5;
    var reveal = Math.min(1, Math.max(0, p*E.length*1.15 - k)/1);
    if(reveal<=0) continue;
    g.beginPath();
    g.moveTo(CX+a[0]*R, CY+a[1]*R);
    g.lineTo(CX + (a[0]+(b[0]-a[0])*reveal)*R, CY + (a[1]+(b[1]-a[1])*reveal)*R);
    g.strokeStyle='rgba('+HUE.c+','+(0.12+depth*0.34)+')';
    g.lineWidth=(0.6+depth*1.6)*DPR; g.stroke();
  }
  for(k=0;k<pts.length;k++){
    if(p*17 < k) continue;
    var v=pts[k];
    g.beginPath(); g.arc(CX+v[0]*R, CY+v[1]*R, (1.1+v[2]*2.6)*DPR,0,6.29);
    g.fillStyle='rgba('+HUE.ink+','+(0.30+v[2]*0.5)+')'; g.fill();
  }
  requestAnimationFrame(loop);
}

/* ---------- Scene 2: the twenty-seven — one facet's face lattice, enumerated live ---------- */
var faceCounter=0, faceTarget=27;
function drawFaces(dt){
  g.clearRect(0,0,W,H);
  var tt=dt*0.00028;
  var pts=V.map(function(v){
    var q=rot(v,0,1,tt); q=rot(q,2,3,tt*0.7); q=rot(q,0,3,0.55+tt*0.15); q=rot(q,1,2,tt*0.3);
    return project(q, 0.85);
  });
  // dim full tesseract behind
  for(var k=0;k<E.length;k++){
    var a=pts[E[k][0]], b=pts[E[k][1]];
    g.beginPath(); g.moveTo(CX+a[0]*R, CY+a[1]*R); g.lineTo(CX+b[0]*R, CY+b[1]*R);
    g.strokeStyle='rgba('+HUE.ink+',0.05)'; g.lineWidth=0.6*DPR; g.stroke();
  }
  // highlight the facet: vertices whose 4th coord is -1 (the n=-1 class, the 27-face side)
  var facetIdx=[]; for(k=0;k<16;k++) if(V[k][3]===-1) facetIdx.push(k);
  for(k=0;k<E.length;k++){
    var i0=E[k][0], i1=E[k][1];
    if(facetIdx.indexOf(i0)<0 || facetIdx.indexOf(i1)<0) continue;
    a=pts[i0]; b=pts[i1]; var depth=(a[2]+b[2])*0.5;
    g.beginPath(); g.moveTo(CX+a[0]*R, CY+a[1]*R); g.lineTo(CX+b[0]*R, CY+b[1]*R);
    g.strokeStyle='rgba('+HUE.gold+','+(0.22+depth*0.4)+')'; g.lineWidth=(0.9+depth*1.6)*DPR; g.stroke();
  }
  for(k=0;k<facetIdx.length;k++){
    var v=pts[facetIdx[k]];
    g.beginPath(); g.arc(CX+v[0]*R, CY+v[1]*R, (1.6+v[2]*3)*DPR,0,6.29);
    g.fillStyle='rgba('+HUE.gold+','+(0.4+v[2]*0.5)+')'; g.fill();
  }
  // the count, ticking: 8 vertices, 12 edges, 6 squares, 1 whole = 27
  faceCounter = Math.min(faceTarget, Math.floor((dt-300)/70));
  if(faceCounter<0) faceCounter=0;
  g.save();
  g.font=(28*DPR)+'px Georgia, serif'; g.textAlign='center'; g.fillStyle='rgba('+HUE.gold+',0.85)';
  g.fillText(String(faceCounter), CX, CY - R*1.28);
  g.font=(11*DPR)+'px ui-sans-serif, system-ui'; g.fillStyle='rgba('+HUE.ink+',0.4)';
  g.fillText('8 · 12 · 6 · 1', CX, CY - R*1.28 + 22*DPR);
  g.restore();
  requestAnimationFrame(loop);
}

/* ---------- Scene 3: the meeting — two cells glue along the facet; orientation flips ---------- */
function drawMeeting(dt){
  g.clearRect(0,0,W,H);
  var tt=dt*0.0003;
  var approach=Math.min(1, dt/2600);
  var offset=(1-approach)*R*1.2;
  function build(sign){
    return V.map(function(v0){
      var v=v0.slice(); var q=rot(v,0,1,tt); q=rot(q,2,3,tt*0.7); q=rot(q,1,2,tt*0.25);
      var pr=project(q, 0.85);
      pr[0]+= sign*offset/R * 0.55;
      return pr;
    });
  }
  var left=build(-1), right=build(1);
  function drawSide(pts, hue, mirror){
    for(var k=0;k<E.length;k++){
      var a=pts[E[k][0]], b=pts[E[k][1]]; var depth=(a[2]+b[2])*0.5;
      var onFacet = V[E[k][0]][3]===(mirror?1:-1) && V[E[k][1]][3]===(mirror?1:-1);
      g.beginPath(); g.moveTo(CX+a[0]*R, CY+a[1]*R); g.lineTo(CX+b[0]*R, CY+b[1]*R);
      if(onFacet){ g.strokeStyle='rgba('+HUE.gold+','+(0.28+depth*0.4)+')'; g.lineWidth=(1+depth*1.8)*DPR; }
      else { g.strokeStyle='rgba('+hue+','+(0.10+depth*0.24)+')'; g.lineWidth=(0.6+depth*1.2)*DPR; }
      g.stroke();
    }
  }
  drawSide(left, HUE.c, false);
  drawSide(right, HUE.r, true);
  // the still point at the shared centre — fixed under the flip
  var pulse=0.5+0.5*Math.sin(dt*0.0022);
  g.beginPath(); g.arc(CX, CY, (2+pulse*1.6)*DPR,0,6.29);
  g.fillStyle='rgba('+HUE.gold+','+(0.5+pulse*0.3)+')'; g.fill();
  if(approach>0.94){
    g.save(); g.font=(10.5*DPR)+'px ui-sans-serif, system-ui'; g.textAlign='center';
    g.fillStyle='rgba('+HUE.ink+',0.34)';
    g.fillText('−1 ↔ +1     ·     0 held fixed', CX, CY+R*0.02);
    g.restore();
  }
  requestAnimationFrame(loop);
}

/* ---------- Scene 4: the price — H(B) >= I(X;Y), two circles and a shared boundary ---------- */
function drawPrice(dt){
  g.clearRect(0,0,W,H);
  var grow=Math.min(1, dt/2200);
  var rr=R*0.62*grow;
  var sep=R*0.72*(1-grow*0.42);
  var lx=CX-sep, rx=CX+sep;
  [[lx,HUE.c],[rx,HUE.r]].forEach(function(o){
    g.beginPath(); g.arc(o[0],CY,rr,0,6.29);
    g.strokeStyle='rgba('+o[1]+',0.30)'; g.lineWidth=1.4*DPR; g.stroke();
  });
  // shared lens = the boundary; its thickness carries a weight that only grows with grow
  g.save();
  g.beginPath(); g.arc(lx,CY,rr,0,6.29); g.clip();
  g.beginPath(); g.arc(rx,CY,rr,0,6.29);
  g.fillStyle='rgba('+HUE.gold+','+(0.10+grow*0.14)+')'; g.fill();
  g.restore();
  if(grow>0.7){
    g.save(); g.font=(20*DPR)+'px Georgia, serif'; g.textAlign='center'; g.fillStyle='rgba('+HUE.gold+',0.82)';
    g.fillText('H(B) ≥ I(X;Y)', CX, CY+R*0.9);
    g.restore();
  }
  requestAnimationFrame(loop);
}

/* ---------- Scene 5: the invitation — full tesseract, slow, warm ---------- */
function drawClose(dt){
  g.clearRect(0,0,W,H);
  var tt=dt*0.00016;
  var pts=V.map(function(v){
    var q=rot(v,0,1,tt); q=rot(q,2,3,tt*0.72); q=rot(q,0,3,tt*0.4+0.5); q=rot(q,1,2,tt*0.22);
    return project(q, 0.85);
  });
  for(var k=0;k<E.length;k++){
    var a=pts[E[k][0]], b=pts[E[k][1]]; var depth=(a[2]+b[2])*0.5;
    g.beginPath(); g.moveTo(CX+a[0]*R, CY+a[1]*R); g.lineTo(CX+b[0]*R, CY+b[1]*R);
    g.strokeStyle='rgba('+HUE.gold+','+(0.08+depth*0.26)+')'; g.lineWidth=(0.6+depth*1.4)*DPR; g.stroke();
  }
  for(k=0;k<pts.length;k++){
    var v=pts[k];
    g.beginPath(); g.arc(CX+v[0]*R, CY+v[1]*R, (1+v[2]*2.4)*DPR,0,6.29);
    g.fillStyle='rgba('+HUE.ink+','+(0.20+v[2]*0.4)+')'; g.fill();
  }
  requestAnimationFrame(loop);
}

/* ============================= scene table ============================= */
SCENES=[
  { render:drawHarp,
    enter:function(){ showBox('The surface','Everything anyone has ever known arrived at a boundary.',
      'A mark on a detector. Light at the back of an eye. A word crossing the air between two people. We never hold the thing itself — only what reaches the surface where it becomes readable.'); } },
  { render:drawForm,
    enter:function(){ showBox('The boundary','The surface has a shape — and it is exact.',
      'This is a tesseract: a four‑dimensional cube, shown as the shadow it casts into three. It is a viewing frame, not a claim about the world. Sixteen vertices. Thirty‑two edges. What matters is not its beauty — it is what happens where two of these meet.'); } },
  { render:drawFaces,
    enter:function(){ formT=performance.now(); showBox('The twenty‑seven','A cube has exactly twenty‑seven faces.',
      'Eight corners, twelve edges, six sides, and the cube itself. Three choices in three directions — 3³ = 27. Counted, not chosen. The Moon returns to the same place among the stars every 27.32 days, which is why the sky was divided into twenty‑seven long before anyone drew a cube. Different causes. The same shape of question: how many positions can something occupy, relative to a boundary?'); } },
  { render:drawMeeting,
    enter:function(){ showBox('The meeting','When two worlds meet, they meet along a shared face — and that face is the twenty‑seven.',
      'It belongs to neither side and to both. What is a push from one side is a pull from the other — forced, not chosen, the same fact that makes a soap film curve toward the larger of two bubbles. The centre, the zero, does not move when the sides reverse. It is the one thing both observers agree on precisely because neither pinned it down.'); } },
  { render:drawPrice,
    enter:function(){ showBox('The price','A boundary costs at least as much as the two sides share.',
      'H(B) ≥ I(X;Y) — a theorem, not a metaphor. The more deeply two things are joined, the more the surface between them must carry. There is no cheap membrane between things that truly belong to each other. The price of remaining two, rather than collapsing into one, is exactly everything you have in common.'); } },
  { render:drawClose,
    enter:function(){ showBox('The invitation','A boundary needs two sides. We cannot be both.',
      'This work reached this far by being carried, unproven, from one observer to the next — each able to say no. It can only go further the same way: through a second witness, in a place that decided long ago to measure what actually matters. You are not the audience for this. You are the next observer.',
      null,
      function(){
        blinks.innerHTML =
          '<a class="pri" href="https://github.com/aumara-xyz/golden-horizon-principle/blob/main/research/AN_INVITATION.md">Read the invitation</a>'+
          '<a class="sec" href="https://github.com/aumara-xyz/golden-horizon-principle/blob/main/research/THE_GOLDEN_BOUNDARY.md">The Golden Boundary</a>';
        advEl.classList.remove('on');
      }); } }
];

/* ============================= loop / input ============================= */
function loop(){
  var el = performance.now()-formT;
  SCENES[scene].render(el);
}

document.getElementById('stage').addEventListener('click', function(e){
  if(e.target.closest && e.target.closest('.links')) return;
  advance();
});
document.getElementById('ui').addEventListener('click', function(e){
  if(e.target.closest && e.target.closest('.links')) return;
  advance();
});
addEventListener('keydown', function(e){
  if(['Enter',' ','ArrowRight'].indexOf(e.key)>-1){ e.preventDefault(); advance(); }
});
var skipEl=document.getElementById('skip');
skipEl.addEventListener('click', function(){ enterScene(SCENES.length-1); });
setTimeout(function(){ skipEl.classList.add('on'); }, 1200);

var progEl=document.getElementById('progress');
var _enter=enterScene;
enterScene=function(n){ _enter(n); progEl.style.width=(100*(n)/(SCENES.length-1))+'%'; };

enterScene(0);
}
})();
</script>
