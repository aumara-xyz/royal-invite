<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Golden Boundary — An Invitation</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A boundary, a tesseract, and an invitation — for the Royal University of Bhutan.">
<meta name="theme-color" content="#11141d">
<!--
  aukora.xyz/royal-invite — self-contained: no frameworks, no trackers, no external requests.
  Wide screens: text left, artwork right, both large. Narrow/mobile: artwork on top, text below.
  A Riemann-zeta-inspired tunnel opens the piece, ignites, and grows into the tesseract on screen —
  an original, non-interactive homage, not the real Zeta Harp instrument (linked, not embedded, not
  described as if inspected). Text reveals sentence by sentence, fully laid out from frame one, so
  nothing reflows or stacks abruptly. Click / tap / arrow keys / space to advance, subtle text-only
  back and skip controls, no overclaiming beyond what the real system actually does today.
-->
<style>
  :root{
    --hue-l: 129,212,180;
    --hue-c: 150,180,255;
    --hue-r: 196,170,255;
    --gold:  224,181,102;
    --warn:  224,130,108;

    --bg0:   #11141d;
    --bg1:   #171c28;
    --panel: rgba(255,255,255,.045);
    --panel-br: rgba(255,255,255,.06);
    --border:rgba(255,255,255,.10);
    --ink:   rgba(244,246,255,.94);
    --dim:   rgba(228,232,248,.72);
    --faint: rgba(220,226,245,.56);
    --ease: cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; overflow:hidden; background:var(--bg0); color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased}
  body{
    background:
      radial-gradient(ellipse 70% 45% at 50% 38%, rgba(var(--gold),.045), transparent 60%),
      linear-gradient(180deg, var(--bg0), var(--bg1));
  }
  body.split{
    background:
      radial-gradient(ellipse 55% 55% at 74% 50%, rgba(var(--gold),.05), transparent 60%),
      linear-gradient(180deg, var(--bg0), var(--bg1));
  }
  canvas{position:fixed; inset:0; display:block; touch-action:none}
  #stage{position:fixed; inset:0; cursor:pointer}

  /* ---------- password veil ---------- */
  .veil{position:fixed; inset:0; z-index:20; display:grid; place-items:center;
    background:linear-gradient(180deg, var(--bg0), var(--bg1)); transition:opacity 1.1s var(--ease)}
  .gate{width:min(88vw,400px); text-align:center; padding:2.6rem 2.1rem;
    border:1px solid var(--border); border-radius:16px; background:var(--panel)}
  .mark{font-size:.78rem; letter-spacing:.2em; text-transform:uppercase; color:rgb(var(--gold)); margin-bottom:1.5rem}
  .gate h1{font-weight:600; font-size:1.5rem; letter-spacing:-.01em; margin-bottom:.5rem; color:var(--ink)}
  .gate p{color:var(--dim); font-size:.95rem; line-height:1.65; margin-bottom:1.6rem}
  .gate input{width:100%; text-align:center; letter-spacing:.3em; text-transform:lowercase;
    background:var(--panel); border:1px solid var(--border); border-radius:10px; color:var(--ink);
    font-family:inherit; font-size:1rem; padding:.75rem 0; outline:none; transition:border-color .2s}
  .gate input:focus{border-color:rgb(var(--gold))}
  .hint{margin-top:1.1rem; font-size:.82rem; color:var(--faint)}
  .err{color:var(--warn); min-height:1rem; font-size:.85rem; margin-top:.7rem}

  /* ---------- text box (video-game style, sentence-by-sentence reveal) ---------- */
  #ui{position:fixed; inset:0; z-index:10; pointer-events:none;
    display:flex; flex-direction:column; justify-content:flex-end; align-items:center;
    padding:0 6vw 9vh}
  body.split #ui{ flex-direction:row; justify-content:flex-start; align-items:center; padding:0 0 0 7vw }
  #box{max-width:640px; width:100%; opacity:0; transform:translateY(14px);
    transition:opacity .6s var(--ease), transform .6s var(--ease)}
  #box.on{opacity:1; transform:translateY(0)}
  body.split #box{ max-width:min(560px,40vw) }
  .k{font-size:.78rem; letter-spacing:.2em; text-transform:uppercase; color:rgb(var(--gold)); margin-bottom:.7rem}
  #box h2{font-weight:600; font-size:clamp(1.4rem,3.6vw,2.1rem); line-height:1.3; letter-spacing:-.01em; margin-bottom:.9rem; color:var(--ink)}
  #box p{color:var(--dim); font-size:clamp(1.02rem,2vw,1.12rem); line-height:1.74}
  #box p .ln{opacity:0; transition:opacity .7s ease}
  #box p .ln.show{opacity:1}
  #box p .ln.fence{display:block; margin-top:.7rem; color:var(--faint); font-size:.86rem; font-style:italic}
  .links{margin-top:1.8rem; display:flex; gap:.7rem; flex-wrap:wrap; pointer-events:auto}
  .links a{display:inline-block; text-decoration:none; font-size:.95rem; letter-spacing:.02em;
    padding:1rem 1.9rem; border-radius:12px; transition:transform .25s var(--ease), box-shadow .25s var(--ease)}
  .links a.pri{background:rgb(var(--gold)); color:#171308; font-weight:600}
  .links a.sec{background:transparent; border:1px solid var(--border); color:var(--ink)}
  .links a:hover{transform:translateY(-2px)}
  .links a.pri:hover{box-shadow:0 12px 30px -10px rgba(var(--gold),.6)}

  #advance{position:fixed; bottom:3.2vh; left:0; right:0; z-index:10; text-align:center;
    font-size:.82rem; letter-spacing:.12em; text-transform:uppercase; color:var(--faint);
    pointer-events:none; opacity:0; transition:opacity .5s ease}
  #advance.on{opacity:1; animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}

  /* subtle text-only controls — never buttons */
  #skip,#back{position:fixed; top:2.4vh; z-index:11; font-size:.8rem; letter-spacing:.06em;
    color:var(--faint); cursor:pointer; opacity:0; transition:opacity .5s ease, color .2s;
    pointer-events:none; background:none; border:none; padding:.3rem .1rem}
  #skip{right:2.4vh}
  #back{left:2.4vh}
  #skip.on,#back.on{opacity:.75; pointer-events:auto}
  #skip:hover,#back:hover{color:var(--ink); opacity:1}

  #progress{position:fixed; top:0; left:0; height:2px; background:rgb(var(--gold));
    z-index:12; transition:width .5s var(--ease); width:0%}

  #glWell{
    position:fixed; inset:0;
    z-index:0; opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .9s var(--ease);
    background:transparent;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, transparent 26%, rgba(0,0,0,.18) 38%, #000 52%, #000 100%);
            mask-image: linear-gradient(90deg, transparent 0%, transparent 26%, rgba(0,0,0,.18) 38%, #000 52%, #000 100%);
  }
  body.harp-live #glWell{ opacity:1 !important; visibility:visible !important; }
  #glWell canvas#gl{
    position:absolute; inset:0; width:100% !important; height:100% !important;
    display:block; background:transparent;
  }
  canvas#gl{ z-index:0; background:transparent; }
  body.harp-live canvas#stage{ visibility:visible; pointer-events:none; background:transparent; }
  body.harp-live #ui{ pointer-events:auto; }
  #harpChrome{ position:absolute; width:0; height:0; overflow:hidden; visibility:hidden; }
  #fade{ position:fixed; inset:0; z-index:15; background:transparent; pointer-events:none; opacity:0; }
  @media (max-width:859px){
    #glWell{
      -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 42%, rgba(0,0,0,.2) 62%, transparent 84%);
              mask-image: linear-gradient(180deg, #000 0%, #000 42%, rgba(0,0,0,.2) 62%, transparent 84%);
    }
  }
  @media (prefers-reduced-motion:reduce){ #advance{animation:none} #glWell{transition:none} }
</style>
</head>

    <div id="torusViews"><button class="tor-view on" id="torViewShadow" data-view="shadow"></button><button class="tor-view" id="torViewSlice" data-view="slice"></button><button class="tor-view" id="torViewUnfold" data-view="unfold"></button></div>

  <div id="flowerPanel" class="panel hidden"><h2></h2><canvas id="flower" width="712" height="712"></canvas></div>

  <div id="microPanel" class="panel hidden"><select id="microZeroSel"></select><canvas id="microCurve" width="800" height="260"></canvas><canvas id="microBars" width="800" height="300"></canvas><div id="microNums"></div></div>
  <div id="fencePanel" class="panel hidden"><div id="fenceInner"></div><table id="fenceRTable"></table><p id="fenceRNote"></p><p id="fenceDisclosures"></p><table id="fenceVTable"></table></div>

<div class="veil" id="veil">
  <div class="gate">
    <div class="mark">Aukora · The Golden Boundary</div>

<script src="js/zh-fixtures-1.js"></script>
<script src="js/zh-fixtures-2.js"></script>
<script src="js/zh-math.js"></script>
<script src="js/zh-app-1-state.js"></script>
<script src="js/zh-app-2-gl.js"></script>
<script src="js/zh-app-3-panels.js"></script>
<script src="js/zh-app-4-audio.js"></script>
<script src="js/zh-app-5-orchestration.js"></script>
<script src="js/zh-app-6-main.js"></script>

<script>
(function(){
"use strict";

/* ============================= gate ============================= */
var veil=document.getElementById('veil'), inp=document.getElementById('pass'), err=document.getElementById('err');
function openGate(){
  veil.style.opacity='0';
  setTimeout(function(){ veil.style.display='none'; if(window.HARP) HARP.release(); boot(); }, 1100);
}
function tryOpen(){
  if(inp.value.trim().toLowerCase()==='tesseract'){ err.textContent=''; openGate(); }
  else { err.textContent='not yet — the nine‑letter room'; inp.value=''; }
}
inp.addEventListener('keydown', function(e){ if(e.key==='Enter') tryOpen(); });
inp.addEventListener('input', function(){ if(inp.value.length>=9) tryOpen(); });
setTimeout(function(){ inp.focus(); }, 400);

/* ============================= boot ============================= */
function boot(){

var cv=document.getElementById('stage'), g=cv.getContext('2d'), W,H,DPR,CX=0,CY=0,R=0;
var boxEl=document.getElementById('box'), isSplit=false;

function computeMode(){
  isSplit = innerWidth>=860 && innerWidth>=innerHeight*1.12;
  document.body.classList.toggle('split', isSplit);
}
function size(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  layout();
}
// Bigger, and layout-aware: wide screens split into a text column and a dedicated art half so the
// tesseract can actually use the room; narrow/mobile stacks art above the (measured) text box.
function layout(){
  computeMode();
  if(isSplit){
    var leftW=innerWidth*0.44, rightW=innerWidth-leftW;
    CX=(leftW+rightW/2)*DPR; CY=H/2;
    R=Math.min(rightW, innerHeight*0.88)*DPR*0.68;
  } else {
    var r=boxEl.getBoundingClientRect();
    var boxTop=r.height? r.top : innerHeight*0.60;
    var topMargin=Math.max(56, innerHeight*0.07);
    var avail=Math.max(140, boxTop-26-topMargin);
    CX=W/2;
    CY=(topMargin+avail*0.54)*DPR;
    R=Math.max(Math.min(W,H)*0.20, Math.min(W, avail*DPR)*0.50);
  }
}
size(); addEventListener('resize', size);

var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
var HUE={l:'129,212,180', c:'150,180,255', r:'196,170,255', gold:'224,181,102', warn:'224,130,108', ink:'244,246,255'};

/* ---------- 4-cube geometry (verified: 3^3=27, 3^4=81, the 27/27/27 split) ---------- */
var V=[]; for(var i=0;i<16;i++) V.push([(i&1?1:-1),(i&2?1:-1),(i&4?1:-1),(i&8?1:-1)]);
var E=[]; for(i=0;i<16;i++) for(var j=i+1;j<16;j++){ var d=i^j; if((d&(d-1))===0) E.push([i,j]); }
function rot(p,a,b,t){ var c=Math.cos(t),s=Math.sin(t); var q=p.slice();
  q[a]=p[a]*c-p[b]*s; q[b]=p[a]*s+p[b]*c; return q; }
function project(p, wArg){
  var w=1/(2.7-p[3]*(wArg===undefined?0.9:wArg));
  var x=p[0]*w, y=p[1]*w, z=p[2]*w;
  var d=1/(2.5-z*0.8); return [x*d, y*d, (z+2)*0.5];
}
function tess(tt, spin){
  return V.map(function(v){
    var q=rot(v,0,1,tt*(spin?1.3:1)); q=rot(q,2,3,tt*0.9*(spin?1:0.8));
    q=rot(q,0,3,tt*0.5+ (spin===2?0.5:0)); q=rot(q,1,2,tt*0.32);
    return project(q, 0.85);
  });
}

/* ---------- small shared canvas primitives ---------- */
function dot(x,y,r,hue,a){ g.beginPath(); g.arc(x,y,r,0,6.29); g.fillStyle='rgba('+hue+','+a+')'; g.fill(); }
function seg(x1,y1,x2,y2,hue,a,w){ g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2);
  g.strokeStyle='rgba('+hue+','+a+')'; g.lineWidth=w*DPR; g.stroke(); }
function segP(x1,y1,x2,y2,hue,a,w,p){ seg(x1,y1, x1+(x2-x1)*p, y1+(y2-y1)*p, hue,a,w); }
function label(txt,x,y,size,hue,a,align){
  g.save(); g.font=(size*DPR)+'px ui-sans-serif, system-ui'; g.textAlign=align||'center';
  g.fillStyle='rgba('+hue+','+a+')'; g.fillText(txt,x,y); g.restore();
}
// R can now dwarf the available margin above/below CY (split-mode art can run near-edge-to-edge),
// so label offsets are clamped to a share of the ACTUAL room on that side, never past it.
function aboveY(mult){ return CY - Math.min(R*mult, CY*0.82); }
function belowY(mult){ return CY + Math.min(R*mult, (H-CY)*0.6); }
function leftX(mult){ return CX - Math.min(R*mult, CX*0.9); }
function rightX(mult){ return CX + Math.min(R*mult, (W-CX)*0.9); }
function fitR(mult){ return Math.min(R*mult, Math.min(CX,W-CX)*0.86, Math.min(CY,H-CY)*0.86); }

/* ---------- the zeta tunnel — an original homage, reused by scenes 0 and 1 ---------- */
function tunnelRings(dt, alphaMul){
  var rings=6, segs=10;
  for(var ri=0; ri<rings; ri++){
    var depth=ri/(rings-1), rad=R*(1.55-depth*1.05), rot0=dt*0.00016+ri*0.5, pts=[];
    for(var s=0;s<=segs;s++){
      var a=(s/segs)*6.2832+rot0, wob=1+0.06*Math.sin(a*3+ri*1.7);
      pts.push([CX+Math.cos(a)*rad*wob, CY+Math.sin(a)*rad*wob*0.86]);
    }
    g.beginPath();
    for(var p=0;p<pts.length;p++){ if(p===0) g.moveTo(pts[p][0],pts[p][1]); else g.lineTo(pts[p][0],pts[p][1]); }
    g.strokeStyle='rgba('+HUE.gold+','+(0.22*alphaMul)+')';
    g.lineWidth=(1-depth*0.4)*DPR; g.stroke();
  }
}
function tunnelStrands(dt, alphaMul, n){
  n=n||100;
  for(var i=0;i<n;i++){
    var a=(i/n)*6.2832+Math.sin(i*12.9017)*0.5, rad=R*(1.9+0.7*Math.sin(i*7.233));
    var a2=a+dt*0.00005;
    var sx=CX+Math.cos(a2)*rad, sy=CY+Math.sin(a2)*rad*0.62;
    var mx=CX+(sx-CX)*0.45, my=CY+(sy-CY)*0.45+Math.sin(i*3.1+dt*0.0004)*R*0.05;
    var pulse=0.5+0.5*Math.sin(dt*0.0012+i*1.7);
    g.beginPath(); g.moveTo(sx,sy); g.quadraticCurveTo(mx,my,CX,CY);
    g.strokeStyle='rgba('+((i%2===0)?HUE.c:HUE.r)+','+((0.10+0.10*pulse)*alphaMul)+')';
    g.lineWidth=0.7*DPR; g.stroke();
  }
}
function tunnelGlow(dt, alphaMul, boost){
  var rad=(10+boost*22)*DPR;
  var grad=g.createRadialGradient(CX,CY,0,CX,CY,rad*2.4);
  grad.addColorStop(0,'rgba('+HUE.ink+','+(0.55*alphaMul)+')');
  grad.addColorStop(0.4,'rgba('+HUE.c+','+(0.18*alphaMul)+')');
  grad.addColorStop(1,'rgba('+HUE.c+',0)');
  g.fillStyle=grad; g.beginPath(); g.arc(CX,CY,rad*2.4,0,6.2832); g.fill();
  dot(CX,CY,(2+boost*2)*DPR, HUE.gold, 0.5*alphaMul+boost*0.3);
}

/* ============================= text box / sentence reveal ============================= */
var bk=document.getElementById('bk'), bh=document.getElementById('bh'),
    bp=document.getElementById('bp'), blinks=document.getElementById('blinks'), advEl=document.getElementById('advance');
var revealing=false, revealSpans=[], revealTimer=null, onDoneCb=null;

function splitSentences(text){
  var parts = text.match(/[^.!?]+[.!?]+(\s+|$)|[^.!?]+$/g) || [text];
  return parts.map(function(s){ return s.trim(); }).filter(Boolean);
}
function showBox(kicker, head, body, fence, done){
  boxEl.classList.remove('on'); bk.textContent=kicker; bh.textContent=head;
  bp.innerHTML=''; blinks.innerHTML='';
  requestAnimationFrame(function(){ boxEl.classList.add('on'); });

  var stagger = reduce ? 0 : 260;
  var sentences = splitSentences(body);
  revealSpans = sentences.map(function(s,i){
    var span=document.createElement('span'); span.className='ln';
    span.textContent=(i>0?' ':'')+s; span.style.transitionDelay=(stagger*i)+'ms';
    bp.appendChild(span); return span;
  });
  if(fence){
    var f=document.createElement('span'); f.className='ln fence';
    f.textContent=fence; f.style.transitionDelay=(stagger*revealSpans.length)+'ms';
    bp.appendChild(f); revealSpans.push(f);
  }
  revealing=true; advEl.classList.remove('on'); onDoneCb=done;
  void bp.offsetWidth;
  requestAnimationFrame(function(){ revealSpans.forEach(function(s){ s.classList.add('show'); }); });
  clearTimeout(revealTimer);
  revealTimer=setTimeout(finishReveal, stagger*revealSpans.length+700);
}
function completeRevealNow(){
  clearTimeout(revealTimer);
  revealSpans.forEach(function(s){ s.style.transition='none'; s.style.transitionDelay='0ms'; s.classList.add('show'); });
  finishReveal();
}
function finishReveal(){ revealing=false; advEl.classList.add('on'); if(onDoneCb) onDoneCb(); }

/* ============================= scenes ============================= */
var scene=0, formT=0;
var SCENES;

function enterScene(n){
  scene=n; formT=performance.now();
  SCENES[n].enter();
}
function advance(){
  if(revealing){ completeRevealNow(); return; }
  if(scene < SCENES.length-1) enterScene(scene+1);
}
function goBack(){
  if(scene>0) enterScene(scene-1);
}

/* =====================================================================
   ACT I — LINE, ZERO, THEN SHAPES (harp only on the first two)
   ===================================================================== */
function drawZetaA(dt){
  g.clearRect(0,0,W,H);
  requestAnimationFrame(loop);
}
function drawZetaB(dt){
  g.clearRect(0,0,W,H);
  var land=Math.min(1, dt/1600);
  var ease=1-Math.pow(1-land, 3);
  g.beginPath(); g.moveTo(CX, CY-R*1.15); g.lineTo(CX, CY+R*1.15);
  g.strokeStyle='rgba('+HUE.gold+','+(0.12+0.28*ease)+')'; g.lineWidth=1.2*DPR; g.stroke();
  var x=CX + (1-ease)*R*0.85;
  var y=CY + Math.sin((1-ease)*6)*R*0.12*(1-ease);
  var pulse=0.5+0.5*Math.sin(dt*0.006);
  dot(x, y, (2.4+land*5+pulse*1.6)*DPR, HUE.gold, 0.3+land*0.6);
  if(land>0.55){
    g.beginPath(); g.arc(CX,CY, (6+ (land-0.55)*40)*DPR, 0, 6.29);
    g.strokeStyle='rgba('+HUE.gold+','+(0.28*(1-land))+')'; g.lineWidth=1.1*DPR; g.stroke();
  }

function cube3(tt){
  var out=[], i, x,y,z,c,s,x2,z2,d;
  c=Math.cos(tt); s=Math.sin(tt);
  for(i=0;i<8;i++){
    x=(i&1?1:-1); y=(i&2?1:-1); z=(i&4?1:-1);
    x2=x*c-z*s; z2=x*s+z*c;
    d=2.5/(2.5-z2*0.38);
    out.push([x2*d, y*d, (z2+2)*0.5]);
  }
  return out;
}
var CUBE_E=[[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];
var CUBE_F=[[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]];

function drawCube3(pts, faceA, edgeA){
  var k,a,b,f,i,depth;
  if(faceA){
    for(f=0;f<6;f++){
      var idx=CUBE_F[f], on=faceA[f]||0;
      if(on<0.02) continue;
      g.beginPath();
      for(i=0;i<4;i++){
        var v=pts[idx[i]];
        var x=CX+v[0]*R*0.72, y=CY+v[1]*R*0.72;
        if(i===0) g.moveTo(x,y); else g.lineTo(x,y);
      }
      g.closePath();
      g.fillStyle='rgba('+HUE.gold+','+(0.06*on)+')'; g.fill();
    }
  }
  for(k=0;k<CUBE_E.length;k++){
    a=pts[CUBE_E[k][0]]; b=pts[CUBE_E[k][1]];
    depth=(a[2]+b[2])*0.5;
    seg(CX+a[0]*R*0.72,CY+a[1]*R*0.72, CX+b[0]*R*0.72,CY+b[1]*R*0.72, HUE.ink, (edgeA||0.22)+depth*0.2, 0.8+depth);
  }
}

  for(k=0;k<jobs;k++){
    var a2=k/jobs*6.28, rr=R*1.32;
    var x=CX+Math.cos(a2+tt*0.15)*rr, y=CY+Math.sin(a2+tt*0.15)*rr*0.6;
    var tick=((dt*0.00028 - k/jobs) % 1 + 1) % 1;
    var hot = tick<0.12 ? 1-(tick/0.12) : 0;
    dot(x,y, (2.2+hot*3.2)*DPR, HUE.gold, 0.18+hot*0.6);
  }
  requestAnimationFrame(loop);
}

function drawPrice(dt){
  g.clearRect(0,0,W,H);
  var grow=Math.min(1, dt/2200), base=fitR(1), rr=base*0.5*grow, sep=base*0.55*(1-grow*0.42);
  var lx=CX-sep, rx=CX+sep;
  [[lx,HUE.c],[rx,HUE.r]].forEach(function(o){
    g.beginPath(); g.arc(o[0],CY,rr,0,6.29);
    g.strokeStyle='rgba('+o[1]+',0.30)'; g.lineWidth=1.5*DPR; g.stroke();
  });
  g.save(); g.beginPath(); g.arc(lx,CY,rr,0,6.29); g.clip();
  g.beginPath(); g.arc(rx,CY,rr,0,6.29);
  g.fillStyle='rgba('+HUE.gold+','+(0.10+grow*0.14)+')'; g.fill(); g.restore();
  if(grow>0.7) label('what they share', CX, aboveY(1.15), 16, HUE.gold, 0.75);
  requestAnimationFrame(loop);
}

/* ============================= loop / input ============================= */
function loop(){
  layout();
  SCENES[scene].render(performance.now()-formT);
}

document.getElementById('stage').addEventListener('click', function(e){
  if(e.target.closest && e.target.closest('.links')) return;
  advance();
});
document.getElementById('ui').addEventListener('click', function(e){
  if(e.target.closest && e.target.closest('.links')) return;
  advance();
});
addEventListener('keydown', function(e){
  if(['Enter',' ','ArrowRight'].indexOf(e.key)>-1){ e.preventDefault(); advance(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); goBack(); }
});
var skipEl=document.getElementById('skip'), backEl=document.getElementById('back');
skipEl.addEventListener('click', function(e){ e.stopPropagation(); enterScene(SCENES.length-1); });
backEl.addEventListener('click', function(e){ e.stopPropagation(); goBack(); });
setTimeout(function(){ skipEl.classList.add('on'); }, 1200);

var progEl=document.getElementById('progress');
var _enter=enterScene;
enterScene=function(n){
  _enter(n);
  if(window.HARP) HARP.live(n<=1);
  progEl.style.width=(100*n/(SCENES.length-1))+'%';
  if(n>0) backEl.classList.add('on'); else backEl.classList.remove('on');
};

enterScene(0);
requestAnimationFrame(loop);
}
