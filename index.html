<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Golden Boundary — An Invitation</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A fly-through of Zeta Harp, the tesseract, and the first door into Aukora.">
<meta name="theme-color" content="#0c1018">
<style>
  :root{
    --gold: 224,181,102;
    --c: 150,180,255;
    --l: 129,212,180;
    --r: 196,170,255;
    --warn: 224,130,108;
    --bg0: #0c1018;
    --bg1: #141a26;
    --ink: rgba(244,246,255,.94);
    --dim: rgba(228,232,248,.70);
    --faint: rgba(220,226,245,.50);
    --border: rgba(255,255,255,.10);
    --panel: rgba(255,255,255,.045);
    --ease: cubic-bezier(.22,1,.36,1);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  body{background:linear-gradient(180deg,var(--bg0),var(--bg1))}
  canvas{position:fixed;inset:0;display:block;touch-action:none}
  #stage{cursor:pointer}

  .veil{position:fixed;inset:0;z-index:30;display:grid;place-items:center;
    background:radial-gradient(ellipse at 50% 30%, #182033 0%, var(--bg0) 70%);
    transition:opacity 1.2s var(--ease)}
  .gate{width:min(90vw,420px);text-align:center;padding:2.7rem 2.2rem;
    border:1px solid var(--border);border-radius:20px;background:var(--panel)}
  .mark{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:rgb(var(--gold));margin-bottom:1.4rem}
  .gate h1{font-weight:560;font-size:1.55rem;letter-spacing:-.02em;margin-bottom:.5rem}
  .gate p{color:var(--dim);font-size:.95rem;line-height:1.65;margin-bottom:1.55rem}
  .gate input{width:100%;text-align:center;letter-spacing:.32em;text-transform:lowercase;
    background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:12px;color:var(--ink);
    font:inherit;font-size:1rem;padding:.8rem 0;outline:none}
  .gate input:focus{border-color:rgb(var(--gold))}
  .hint{margin-top:1rem;font-size:.8rem;color:var(--faint)}
  .err{color:rgb(var(--warn));min-height:1rem;font-size:.85rem;margin-top:.65rem}

  #ui{position:fixed;inset:0;z-index:10;pointer-events:none;
    display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
    padding:0 5vw max(7vh, env(safe-area-inset-bottom));
    transition:justify-content .9s var(--ease), padding .9s var(--ease)}
  #ui.center{justify-content:center;padding-bottom:0}
  #box{max-width:640px;width:100%;opacity:0;transform:translateY(16px);
    transition:opacity .65s var(--ease), transform .65s var(--ease)}
  #box.on{opacity:1;transform:none}
  .k{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:rgb(var(--gold));margin-bottom:.65rem}
  #box h2{font-weight:560;font-size:clamp(1.28rem,3.5vw,1.85rem);line-height:1.28;letter-spacing:-.02em;margin-bottom:.8rem}
  #box p{color:var(--dim);font-size:clamp(.96rem,2vw,1.05rem);line-height:1.7}
  #box .fence{display:block;margin-top:.65rem;color:var(--faint);font-size:.86rem;font-style:italic}

  #talk{display:none;max-width:640px;width:100%;margin-top:1.15rem;pointer-events:auto}
  #talk.on{display:block}
  #talk form{display:flex;gap:.55rem}
  #say{flex:1;min-height:48px;border-radius:14px;border:1px solid var(--border);
    background:rgba(8,10,16,.55);color:var(--ink);font:inherit;font-size:1rem;
    padding:.85rem 1.05rem;outline:none}
  #say:focus{border-color:rgba(var(--gold),.55)}
  #go{min-width:48px;min-height:48px;border:0;border-radius:14px;cursor:pointer;
    background:rgb(var(--gold));color:#171308;font:inherit;font-weight:600;padding:0 1rem}
  #reply{margin-top:.7rem;color:var(--ink);font-size:.95rem;line-height:1.55;min-height:1.4em;opacity:.0;
    transition:opacity .5s var(--ease)}
  #reply.on{opacity:1}

  .links{margin-top:1.4rem;display:flex;gap:.55rem;flex-wrap:wrap;pointer-events:auto}
  .links a{text-decoration:none;font-size:.85rem;padding:.8rem 1.3rem;border-radius:12px;
    transition:transform .25s var(--ease)}
  .links a.pri{background:rgb(var(--gold));color:#171308;font-weight:600}
  .links a.sec{border:1px solid var(--border);color:var(--ink)}
  .links a:hover{transform:translateY(-2px)}

  #advance{position:fixed;bottom:2.6vh;left:0;right:0;z-index:10;text-align:center;
    font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
    pointer-events:none;opacity:0;transition:opacity .45s}
  #advance.on{opacity:1}
  #skip,#back{position:fixed;top:max(2.2vh,env(safe-area-inset-top));z-index:12;
    font-size:.78rem;letter-spacing:.06em;color:var(--faint);cursor:pointer;
    background:none;border:0;padding:.45rem .2rem;opacity:0;pointer-events:none;transition:opacity .4s,color .2s}
  #skip{right:max(2.2vh,env(safe-area-inset-right))}
  #back{left:max(2.2vh,env(safe-area-inset-left))}
  #skip.on,#back.on{opacity:.75;pointer-events:auto}
  #skip:hover,#back:hover{color:var(--ink);opacity:1}
  #progress{position:fixed;top:0;left:0;height:2px;background:rgb(var(--gold));z-index:13;width:0;transition:width .5s var(--ease)}

  #lanes{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;transition:opacity 1.1s var(--ease)}
  #lanes.on{opacity:1}
  .lane{position:absolute;top:10vh;bottom:18vh;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.035)}
  .lane i{display:block;margin:1rem 1rem 0;font-style:normal;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(220,226,245,.62)}
  .lane.l{left:3vw;width:18vw}
  .lane.c{left:23vw;right:23vw}
  .lane.r{right:3vw;width:18vw}
  .lane i{display:block;margin:1rem 1rem 0;font-style:normal;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  @media (max-width:720px){
    .lane.l,.lane.r{display:none}
    .lane.c{left:4vw;right:4vw}
  }
  @media (prefers-reduced-motion:reduce){
    #box,#ui,.veil,#lanes,#reply{transition:none}
  }
</style>
</head>
<body>
<div class="veil" id="veil">
  <div class="gate">
    <div class="mark">Aukora · The Golden Boundary</div>
    <h1>An Invitation</h1>
    <p>A fly-through of how a shape becomes a door.<br>Speak the word to open it.</p>
    <input id="pass" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="passphrase" placeholder="· · · · · · · · ·">
    <div class="err" id="err"></div>
    <div class="hint">a four-dimensional viewing frame · nine letters</div>
  </div>
</div>

<div id="progress"></div>
<canvas id="stage"></canvas>
<div id="lanes" aria-hidden="true">
  <div class="lane l"><i>threads</i></div>
  <div class="lane c"><i>the room</i></div>
  <div class="lane r"><i>apps</i></div>
</div>
<div id="ui">
  <div id="box">
    <div class="k" id="bk"></div>
    <h2 id="bh"></h2>
    <p id="bp"></p>
    <div id="talk">
      <form id="talkform">
        <input id="say" autocomplete="off" maxlength="240" placeholder="speak to the room">
        <button id="go" type="submit">Send</button>
      </form>
      <div id="reply"></div>
    </div>
    <div class="links" id="blinks"></div>
  </div>
</div>
<div id="advance">click to continue</div>
<button id="back" type="button">← back</button>
<button id="skip" type="button">skip ↦</button>

<script>
(function(){
"use strict";

var veil=document.getElementById('veil'), inp=document.getElementById('pass'), err=document.getElementById('err');
function openGate(){
  veil.style.opacity='0';
  setTimeout(function(){ veil.style.display='none'; boot(); }, 1150);
}
function tryOpen(){
  if(inp.value.trim().toLowerCase()==='tesseract'){ err.textContent=''; openGate(); }
  else { err.textContent='not yet — the nine-letter room'; inp.value=''; }
}
inp.addEventListener('keydown', function(e){ if(e.key==='Enter') tryOpen(); });
inp.addEventListener('input', function(){ if(inp.value.length>=9) tryOpen(); });
setTimeout(function(){ inp.focus(); }, 380);

function boot(){
var cv=document.getElementById('stage'), g=cv.getContext('2d');
var W,H,DPR, reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
var ui=document.getElementById('ui'), boxEl=document.getElementById('box'), lanes=document.getElementById('lanes');
var talk=document.getElementById('talk'), say=document.getElementById('say'), reply=document.getElementById('reply');
var bk=document.getElementById('bk'), bh=document.getElementById('bh'), bp=document.getElementById('bp');
var blinks=document.getElementById('blinks'), adv=document.getElementById('advance');
var talked=false, aura=0;

function size(){
  DPR=Math.min(2, window.devicePixelRatio||1);
  W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
}
size(); addEventListener('resize', size);

var HUE={l:'129,212,180',c:'150,180,255',r:'196,170,255',gold:'224,181,102',warn:'224,130,108',ink:'244,246,255'};

/* camera — z flies the tunnel; zoom is perspective tightness */
var cam={z:92, tz:92, zoom:1, tzoom:1, spin:0, tspin:0};
function easeCam(dt){
  var k=reduce?1:Math.min(1, dt*0.0018);
  cam.z += (cam.tz-cam.z)*k;
  cam.zoom += (cam.tzoom-cam.zoom)*k;
  cam.spin += (cam.tspin-cam.spin)*k;
}
function aim(z, zoom, spin){ cam.tz=z; cam.tzoom=zoom; if(spin!==undefined) cam.tspin=spin; }

/* 4-cube */
var V=[], E=[];
(function(){
  var i,j,d;
  for(i=0;i<16;i++) V.push([(i&1?1:-1),(i&2?1:-1),(i&4?1:-1),(i&8?1:-1)]);
  for(i=0;i<16;i++) for(j=i+1;j<16;j++){ d=i^j; if((d&(d-1))===0) E.push([i,j]); }
})();
function rot(p,a,b,t){ var c=Math.cos(t),s=Math.sin(t),q=p.slice(); q[a]=p[a]*c-p[b]*s; q[b]=p[a]*s+p[b]*c; return q; }
function project4(p){
  var w=1/(2.65-p[3]*0.88), x=p[0]*w, y=p[1]*w, z=p[2]*w, d=1/(2.45-z*0.78);
  return [x*d, y*d, (z+2)*0.5];
}
function tess(tt){
  return V.map(function(v){
    var q=rot(v,0,1,tt*1.15); q=rot(q,2,3,tt*0.86); q=rot(q,0,3,tt*0.42); q=rot(q,1,2,tt*0.28);
    return project4(q);
  });
}

function dot(x,y,r,hue,a){ g.beginPath(); g.arc(x,y,r,0,6.283); g.fillStyle='rgba('+hue+','+a+')'; g.fill(); }
function seg(x1,y1,x2,y2,hue,a,w){ g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.strokeStyle='rgba('+hue+','+a+')'; g.lineWidth=w*DPR; g.stroke(); }
function label(txt,x,y,size,hue,a){ g.save(); g.font=(size*DPR)+'px '+getComputedStyle(document.body).fontFamily; g.textAlign='center'; g.fillStyle='rgba('+hue+','+a+')'; g.fillText(txt,x,y); g.restore(); }

var CX,CY,R;
function layoutArt(){
  var r=boxEl.getBoundingClientRect();
  var boxTop=r.height? r.top : innerHeight*(ui.classList.contains('center')?0.78:0.62);
  var top=Math.max(52, innerHeight*0.07);
  var avail=Math.max(130, boxTop-22-top);
  CX=W/2; CY=(top+avail*0.52)*DPR; R=Math.max(Math.min(W,H)*0.12, Math.min(W, avail*DPR)*0.28);
}

/* harp strings — look only, not the instrument */
var STR=22;
function harpPoint(n, u, t){
  var a=0.22+0.78*(0.35+0.65*Math.sin(n*1.7));
  var omega=0.55+n*0.11;
  var phi=n*0.73 + t*0.00022*(0.7+n*0.04);
  var x=a*Math.cos(phi+u*omega);
  var y=a*Math.sin(phi+u*omega)*0.72;
  return [x,y,u];
}
function drawHarp(now, land){
  var i,s,u,p,z,sc,x,y,alpha,started;
  var fly=cam.z;
  /* receding tunnel rings — the room you fly */
  for(i=0;i<16;i++){
    z=(i*9 - (now*0.012)%9) - fly*0.15;
    if(z<4) continue;
    sc=cam.zoom*220/(18+z);
    var rx=sc*0.55, ry=sc*0.34;
    g.beginPath(); g.ellipse(CX,CY,rx,ry,0,0,6.283);
    g.strokeStyle='rgba('+HUE.c+','+(0.035+land*0.07*(1-i/16))+')';
    g.lineWidth=1*DPR; g.stroke();
  }
  for(s=0;s<STR;s++){
    g.beginPath(); started=false;
    for(i=0;i<=72;i++){
      u=(i/72)*160 - 24;
      p=harpPoint(s,u,now);
      z=p[2]-fly;
      if(z<-6 || z>130) continue;
      sc=cam.zoom*280/(32+z);
      x=CX+p[0]*sc*R*0.055;
      y=CY+p[1]*sc*R*0.055;
      if(!started){ g.moveTo(x,y); started=true; } else g.lineTo(x,y);
    }
    alpha=(0.10+0.16*(1-Math.abs(s-STR/2)/(STR/2)))*(0.55+land*0.45);
    g.strokeStyle='rgba('+HUE.c+','+alpha+')';
    g.lineWidth=(1.05+0.7*Math.sin(s*0.9))*DPR;
    if(started) g.stroke();
  }
  g.beginPath(); started=false;
  for(i=0;i<=80;i++){
    u=(i/80)*160-24; z=u-fly;
    if(z<-6||z>130) continue;
    sc=cam.zoom*280/(32+z);
    var sx=0,sy=0;
    for(s=0;s<STR;s++){ p=harpPoint(s,u,now); sx+=p[0]; sy+=p[1]; }
    sx/=STR; sy/=STR;
    x=CX+sx*sc*R*0.11; y=CY+sy*sc*R*0.11;
    if(!started){ g.moveTo(x,y); started=true; } else g.lineTo(x,y);
  }
  g.strokeStyle='rgba('+HUE.gold+','+(0.22+land*0.55)+')';
  g.lineWidth=2.2*DPR;
  if(started) g.stroke();
}

function drawTess(now, reveal){
  var pts=tess(now*0.00028+cam.spin);
  var k,a,b,depth,rv;
  for(k=0;k<E.length;k++){
    rv=Math.min(1, Math.max(0, reveal*E.length*1.12-k));
    if(rv<=0) continue;
    a=pts[E[k][0]]; b=pts[E[k][1]]; depth=(a[2]+b[2])*0.5;
    g.beginPath();
    g.moveTo(CX+a[0]*R, CY+a[1]*R);
    g.lineTo(CX+(a[0]+(b[0]-a[0])*rv)*R, CY+(a[1]+(b[1]-a[1])*rv)*R);
    g.strokeStyle='rgba('+HUE.c+','+(0.10+depth*0.36)+')';
    g.lineWidth=(0.55+depth*1.55)*DPR; g.stroke();
  }
  for(k=0;k<pts.length;k++){
    if(reveal*17<k) continue;
    a=pts[k];
    dot(CX+a[0]*R, CY+a[1]*R, (1.05+a[2]*2.5)*DPR, HUE.ink, 0.28+a[2]*0.5);
  }
}

function drawPoint(p){
  var pulse=0.5+0.5*Math.sin(p*6);
  dot(CX,CY,(2.2+p*6+pulse*1.4)*DPR, HUE.gold, 0.25+p*0.6);
  g.beginPath(); g.arc(CX,CY,(8+p*28)*DPR,0,6.283);
  g.strokeStyle='rgba('+HUE.gold+','+(0.28*(1-p*0.4))+')'; g.lineWidth=1*DPR; g.stroke();
}
function drawLine(p){
  var half=R*1.15*p;
  seg(CX-half,CY, CX+half,CY, HUE.gold, 0.55, 1.4);
  dot(CX-half,CY,3*DPR,HUE.gold,0.8); dot(CX+half,CY,3*DPR,HUE.gold,0.8);
}
function drawTri(p){
  var rr=R*0.95, a=-Math.PI/2, i,x1,y1,x2,y2;
  for(i=0;i<3;i++){
    x1=CX+Math.cos(a+i*2.094)*rr; y1=CY+Math.sin(a+i*2.094)*rr*0.92;
    x2=CX+Math.cos(a+(i+1)*2.094)*rr; y2=CY+Math.sin(a+(i+1)*2.094)*rr*0.92;
    g.beginPath(); g.moveTo(x1,y1); g.lineTo(x1+(x2-x1)*p, y1+(y2-y1)*p);
    g.strokeStyle='rgba('+HUE.c+',0.7)'; g.lineWidth=1.3*DPR; g.stroke();
    if(p>0.2) dot(x1,y1,2.6*DPR,HUE.ink,0.7);
  }
}
function drawStack(now, p){
  var layers=4, L, n, ang, rr, x,y, i;
  for(L=0;L<layers;L++){
    var show=Math.min(1, Math.max(0, p*layers-L));
    if(show<=0) continue;
    rr=R*(0.28+L*0.22);
    n=L===0?1: L===1?3: L===2?6:9;
    for(i=0;i<n;i++){
      ang=(i/n)*6.283 + now*0.00015*L;
      x=CX+Math.cos(ang)*rr*(L?1:0);
      y=CY+Math.sin(ang)*rr*0.62*(L?1:0);
      dot(x,y,(2.1+L*0.3)*DPR, L===0?HUE.gold:HUE.c, 0.18+show*0.5);
    }
    g.beginPath(); g.ellipse(CX,CY,rr,rr*0.62,0,0,6.283);
    g.strokeStyle='rgba('+HUE.ink+','+(0.06+show*0.12)+')'; g.lineWidth=0.8*DPR; g.stroke();
  }
  if(p>0.72) label('3 × 3 × 3  =  27', CX, CY+R*1.25, 12, HUE.gold, 0.55);
}

function drawSpatial(now){
  var pulse=0.5+0.5*Math.sin(now*0.002);
  dot(CX, CY-R*0.15, (3+aura*8+pulse)*DPR, HUE.gold, 0.18+aura*0.45);
  g.beginPath(); g.arc(CX, CY-R*0.15, (18+aura*26)*DPR, 0, 6.283);
  g.strokeStyle='rgba('+HUE.gold+','+(0.12+aura*0.28)+')'; g.lineWidth=1*DPR; g.stroke();
}

/* scenes */
var scene=0, t0=0, typing=false, typeTimer=null, full='', shown=0;
var SCENES;

function showBox(kicker, head, body, fence, opts){
  opts=opts||{};
  boxEl.classList.remove('on');
  bk.textContent=kicker; bh.textContent=head; bp.textContent=''; blinks.innerHTML='';
  talk.classList.remove('on'); reply.classList.remove('on'); reply.textContent='';
  if(opts.center) ui.classList.add('center'); else ui.classList.remove('center');
  if(opts.lanes) lanes.classList.add('on'); else lanes.classList.remove('on');
  if(opts.talk){ talk.classList.add('on'); setTimeout(function(){ say.focus(); }, 400); }
  requestAnimationFrame(function(){ boxEl.classList.add('on'); });
  full=body; shown=0; typing=true; adv.classList.remove('on');
  clearInterval(typeTimer);
  function render(){
    bp.textContent=full.slice(0,shown);
    if(fence && shown>=full.length){
      var f=document.createElement('span'); f.className='fence'; f.textContent=fence; bp.appendChild(f);
    }
  }
  if(reduce){ shown=full.length; render(); finishType(opts); return; }
  typeTimer=setInterval(function(){
    shown+=3; if(shown>full.length) shown=full.length;
    render();
    if(shown>=full.length){ clearInterval(typeTimer); finishType(opts); }
  }, 12);
}
function finishType(opts){
  typing=false;
  if(!(opts&&opts.holdAdvance)) adv.classList.add('on');
}
function completeType(){ clearInterval(typeTimer); shown=full.length; bp.textContent=full; finishType(); }

SCENES=[
  { aim:[78,1.15,0], enter:function(){
    showBox('Zeta Harp',
      'This is the look of the instrument — not the cockpit.',
      'Strings of a known sum, winding forever, folded onto a circle so you can fly them. No sliders. No proof. Only the shape the mathematics already has.');
  }},
  { aim:[36,1.55,0], enter:function(){
    showBox('The pause',
      'A tunnel of phases. One gold line is the resultant.',
      'Each pale thread is a term. The gold is what they add up to — the same curve the observatory draws in the dark. We use this look, not the controls. The harp itself stays a separate instrument.',
      'Not evidence for the Riemann Hypothesis. Known mathematics, shown as light.');
  }},
  { aim:[18,1.35,0.2], enter:function(){
    showBox('From harp to tesseract',
      'Four windings ask for a four-dimensional room.',
      'A phase lives on a circle. Two live on a torus. Four ask for a tesseract — a cube you can only meet as a shadow. The harp explains the tesseract the honest way: as a viewing frame for things that will not sit still in 3-space.');
  }},
  { aim:[40,0.95,0], enter:function(){
    showBox('Rewind',
      'Before strings, before rooms — a single point.',
      'Every later shape is this, addressed. One distinguishable event. The seed. Nothing granted. Just a place the rest can grow from.');
  }},
  { aim:[40,1.0,0], enter:function(){
    showBox('One line',
      'Two points, and the relation between them.',
      'A line is the first memory: this followed that. Still no area, no room, no authority. Only a path.');
  }},
  { aim:[40,1.05,0], enter:function(){
    showBox('A triangle',
      'Three points close. Now there is a face.',
      'The smallest surface. The first inside and outside. Stack these and you get every later cell.');
  }},
  { aim:[42,1.1,0], enter:function(){
    showBox('Sega geometry',
      'Reality stacks. Seed, edge, generate, address.',
      'Point, line, face, cell — each layer is the last one, copied and turned. Three choices on three axes make twenty-seven addresses. The stack is the geometry. Infinity is not stored. It is pointed at.');
  }},

/* leftover stub removed — last scene is complete above */


function enterScene(n){
  scene=n; t0=performance.now();
  var a=SCENES[n].aim; aim(a[0], a[1], a[2]);
  SCENES[n].enter();
  document.getElementById('progress').style.width=(100*n/Math.max(1,SCENES.length-1))+'%';
  var back=document.getElementById('back');
  if(n>0) back.classList.add('on'); else back.classList.remove('on');
}

function advance(){
  if(typing){ completeType(); return; }
  if(scene===8 && !talked){ say.focus(); return; }
  if(scene<SCENES.length-1) enterScene(scene+1);
}
function goBack(){ if(scene>0) enterScene(scene-1); }

document.getElementById('talkform').addEventListener('submit', function(e){
  e.preventDefault(); e.stopPropagation();
  var t=say.value.trim();
  if(!t){ say.focus(); return; }
  talked=true; aura=Math.min(1, aura+0.45);
  reply.textContent='Heard. A ring answers — staged, granting nothing. The composer will sit down now.';
  reply.classList.add('on');
  say.value='';
  adv.classList.add('on');
});

function loop(now){
  var dt=now-(loop._n||now); loop._n=now;
  layoutArt();
  easeCam(dt);
  g.clearRect(0,0,W,H);
  var age=now-t0;
  if(scene===0) cam.tz = 88 - Math.min(48, age*0.018);
  if(scene===1) cam.tz = 34;

  if(scene<=1){
    drawHarp(now, scene===0?Math.min(1,age/2200):1);
  } else if(scene===2){
    drawHarp(now, Math.max(0.12, 1-age/1400));
    drawTess(now, Math.min(1, Math.max(0,(age-200)/900)));
  } else if(scene===3){
    drawHarp(now, Math.max(0, 1-age/900));
    drawPoint(Math.min(1, age/1400));
  } else if(scene===4){
    drawPoint(1); drawLine(Math.min(1, age/1100));
  } else if(scene===5){
    drawLine(1); drawTri(Math.min(1, age/1200));
  } else if(scene===6){
    drawTri(Math.max(0.35, 1-age/800));
    drawStack(now, Math.min(1, age/2000));
  } else if(scene===7){
    drawStack(now, 1);
    drawTess(now, Math.min(1, age/1600)*0.85);
  } else if(scene>=8 && scene<=11){
    drawSpatial(now);
    if(scene>=10) drawTess(now, 0.35);
  } else {
    drawTess(now, 1);
    drawSpatial(now);
  }
  requestAnimationFrame(loop);
}

cv.addEventListener('click', function(e){
  if(e.target.closest && e.target.closest('.links,#talk')) return;
  advance();
});
ui.addEventListener('click', function(e){
  if(e.target.closest && e.target.closest('.links,#talk')) return;
  advance();
});
addEventListener('keydown', function(e){
  if(e.target===say || e.target===inp) return;
  if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){ e.preventDefault(); advance(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); goBack(); }
});
document.getElementById('skip').addEventListener('click', function(e){ e.stopPropagation(); enterScene(SCENES.length-1); });
document.getElementById('back').addEventListener('click', function(e){ e.stopPropagation(); goBack(); });
setTimeout(function(){ document.getElementById('skip').classList.add('on'); }, 1400);

enterScene(0);
requestAnimationFrame(loop);
}
})();
